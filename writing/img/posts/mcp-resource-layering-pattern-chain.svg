<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="#6e6557"/>
    </marker>
    <marker id="arrR" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="#b5382a"/>
    </marker>
  </defs>
  <style>
    .kick{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6e6557;letter-spacing:2px}
    .lbl{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1a1713}
    .meta{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6e6557}
    .metaR{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b5382a}
    .mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1a1713}
    .pane{fill:#fbf8f1;stroke:#d6cfc0;stroke-width:1.4}
    .wire{stroke:#6e6557;stroke-width:1.3;fill:none;marker-end:url(#arr)}
    .wireR{stroke:#b5382a;stroke-width:1.3;fill:none;marker-end:url(#arrR);stroke-dasharray:5 4}
  </style>

  <text x="40" y="38" class="kick">THE ROUTING CHAIN, PER REQUEST</text>

  <rect x="40" y="80" width="200" height="84" rx="10" class="pane"/>
  <text x="62" y="112" class="lbl">the task's words</text>
  <text x="62" y="134" class="meta">no persona flag, no setup —</text>
  <text x="62" y="151" class="meta">the request as typed</text>

  <rect x="320" y="80" width="200" height="84" rx="10" class="pane"/>
  <text x="342" y="112" class="lbl">router</text>
  <text x="342" y="134" class="meta">keyword chain: deterministic,</text>
  <text x="342" y="151" class="meta">inspectable, honest on a miss</text>

  <!-- layered packages -->
  <rect x="600" y="56" width="320" height="60" rx="10" class="pane"/>
  <text x="622" y="82" class="lbl">org package</text>
  <text x="622" y="102" class="meta">shared resources every persona gets</text>
  <rect x="600" y="128" width="320" height="60" rx="10" class="pane"/>
  <text x="622" y="154" class="lbl">team package</text>
  <text x="622" y="174" class="meta">that team's tools, owned + versioned by the team</text>
  <rect x="600" y="200" width="320" height="60" rx="10" class="pane"/>
  <text x="622" y="226" class="lbl">team config — data, not code</text>
  <text x="622" y="246" class="meta">endpoints, thresholds, toggles; no server change</text>

  <rect x="1000" y="128" width="160" height="60" rx="10" class="pane"/>
  <text x="1022" y="154" class="lbl">the host</text>
  <text x="1022" y="174" class="meta">stdio, spawned</text>

  <path class="wire" d="M240 122 L312 122"/>
  <path class="wire" d="M520 122 L592 100"/>
  <path class="wire" d="M520 122 L592 152"/>
  <path class="wire" d="M520 122 L592 224"/>
  <path class="wire" d="M920 158 L992 158"/>

  <path class="wireR" d="M420 172 C420 260 500 320 592 320"/>
  <rect x="600" y="292" width="320" height="56" rx="10" fill="none" stroke="#b5382a" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="622" y="316" class="metaR">no match → generic org persona</text>
  <text x="622" y="336" class="metaR">never a guess; blast radius stays the team's own route</text>

  <text x="600" y="404" class="meta" text-anchor="start">the server knows how to route and load; the package knows what to be.</text>
</svg>
